name: Keep app awake

on:
  schedule:
    # Every 12 hours — comfortably inside Streamlit Community Cloud's
    # inactivity window, which is measured in days, not hours.
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit the app and wake it if asleep
        run: python .github/workflows/keepalive.py
